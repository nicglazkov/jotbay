<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44">
  <!--
    Attention: conflicts kept, or a node reporting an error.

    The dial stays whole and an exclamation sits at the lower right. A mask
    punches a clear ring out of the dial behind the glyph, so the two shapes
    never touch. Without that gap the badge merges into the spokes and the mark
    just reads as damaged rather than as a warning.
  -->
  <defs>
    <mask id="badgeGap">
      <rect width="44" height="44" fill="#FFFFFF"/>
      <circle cx="33.4" cy="33.4" r="9.4" fill="#000000"/>
    </mask>
  </defs>

  <g mask="url(#badgeGap)">
    <g fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round">
      <circle cx="22" cy="22" r="12.5"/>
      <line x1="17.8" y1="17.8" x2="15.1" y2="15.1"/>
      <line x1="26.2" y1="17.8" x2="28.9" y2="15.1"/>
      <line x1="26.2" y1="26.2" x2="28.9" y2="28.9"/>
      <line x1="17.8" y1="26.2" x2="15.1" y2="28.9"/>
    </g>
    <circle cx="22" cy="22" r="4.2" fill="#000000"/>
  </g>

  <g fill="#000000">
    <rect x="31.8" y="26.6" width="3.2" height="8.4" rx="1.6"/>
    <circle cx="33.4" cy="38.4" r="1.9"/>
  </g>
</svg>
