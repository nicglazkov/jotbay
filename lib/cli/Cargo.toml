[package]
name = "jotbay-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command line and TUI front end for Jotbay"

[[bin]]
name = "jotbay"
path = "src/main.rs"

[dependencies]
jotbay-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
ratatui = "0.30"
crossterm = "0.28"
