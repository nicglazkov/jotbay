[package]
name = "jotbay-gui"
version = "1.10.2"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Jotbay desktop application for Windows and Linux"

# Deliberately not a member of ../../Cargo.toml: Tauri drags in WebKitGTK and
# friends on Linux, and the headless servers only ever need the CLI. Keeping it
# a standalone crate means `cargo build` in lib/ stays buildable everywhere.
[workspace]

[lib]
name = "jotbay_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jotbay-core = { path = "../../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
# A first-run screen has to ask where the notes should live, and a text field
# for a filesystem path is not something to put in front of a non-technical user.
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
